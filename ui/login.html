<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>My Work Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#161a22;--panel-2:#1c212b;--line:#262c38;--line-2:#323a49;--text:#e6e8ec;--muted:#8b93a1;--done:#10b981;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px -25px rgba(0,0,0,.6)}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);overflow:hidden}
h1{margin:0;text-align:center;font-size:20px}
p{margin:4px 0 20px;text-align:center;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;padding:12px 13px}
input:focus{outline:2px solid color-mix(in srgb,var(--done) 60%,transparent);outline-offset:0}
button{width:100%;margin-top:14px;font:inherit;font-weight:650;border:0;border-radius:11px;padding:12px;background:var(--done);color:#05140e;cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:20px;margin-top:10px;color:var(--bad);font-size:13px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="av" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
  <h1>My Work Log</h1>
  <p>Enter the password set on the PC</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById("go"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: document.getElementById("pw").value})});
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.replace("/" + location.hash); return; }
    err.textContent = j.error || "Could not sign in";
  } catch { err.textContent = "The PC is not reachable"; }
  b.disabled = false;
};
</script>
</body>
</html>
