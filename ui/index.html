<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E">
<style>
/* ───────── tokens: dark is the default ───────── */
:root{
  color-scheme:dark;
  --bg:#0f1115;--bg-grad:#121620;--panel:#161a22;--panel-2:#1c212b;--panel-3:#232937;--line:#262c38;--line-2:#323a49;
  --text:#e6e8ec;--text-2:#b4bbc8;--muted:#8b93a1;
  --done:#10b981;--done-bg:rgba(16,185,129,.12);--prog:#f59e0b;--prog-bg:rgba(245,158,11,.12);--sky:#38bdf8;--sky-bg:rgba(56,189,248,.12);
  --g1:#d95926;--g2:#2b95d6;--g3:#9085e9;--g4:#d55181;--g5:#199e70;--g6:#c9a227;--g-other:#8b93a1;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --r:14px;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f6f7f9;--bg-grad:#eef1f6;--panel:#ffffff;--panel-2:#f3f5f8;--panel-3:#e9edf3;--line:#e2e6ec;--line-2:#d3d9e2;
  --text:#14171c;--text-2:#3d4552;--muted:#667080;
  --done:#059669;--done-bg:rgba(5,150,105,.10);--prog:#b45309;--prog-bg:rgba(217,119,6,.12);--sky:#0369a1;--sky-bg:rgba(3,105,161,.10);
  --g1:#c94f1f;--g2:#1f7fc4;--g3:#6250d6;--g4:#c43a6e;--g5:#16865f;--g6:#9a7a10;--g-other:#7a8391;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -14px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 500px at 10% -10%,var(--bg-grad),transparent 60%),var(--bg);color:var(--text);
  font:14px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.sm{width:15px;height:15px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.sp{flex:1}

/* ───────── top bar ───────── */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 8px}
.avatar{all:unset;box-sizing:border-box;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;
  background:var(--panel-3);border:1px solid var(--line-2);color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg.i{width:26px;height:26px}
.avatar .cam{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:opacity .15s}
.avatar .cam svg.i{width:18px;height:18px}
.avatar:hover .cam,.avatar:focus-visible .cam{opacity:1}
.avatar:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.avmenu{position:absolute;top:58px;left:0;z-index:40;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:var(--shadow);display:grid;min-width:170px}
.avmenu[hidden]{display:none}
.avmenu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--text-2)}
.avmenu button:hover,.avmenu button:focus-visible{background:var(--panel-2);color:var(--text)}
.top{position:relative}
.hello h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.hello p{margin:0;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel-2);padding:7px 12px;border-radius:10px;
  cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.primary{background:var(--done);border-color:var(--done);color:#05140e;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.icon{padding:7px}

/* ───────── clock banner ───────── */
.clockbar{display:grid;grid-template-columns:1.25fr 1fr;margin-top:10px;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--done) 9%,var(--panel)),var(--panel) 45%,color-mix(in srgb,var(--g2) 9%,var(--panel)))}
.clockbar>div{padding:18px 24px;min-width:0}
.clockbar .cd{border-left:1px solid var(--line)}
.clockbar .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.bigtime{font-size:clamp(46px,7.2vw,84px);font-weight:750;letter-spacing:-.035em;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bigtime .sec{color:var(--muted);font-weight:600}
.bigtime .ap{font-size:.32em;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-left:.25em;vertical-align:.95em}
.cdtime{font-size:clamp(34px,4.8vw,56px);font-weight:750;letter-spacing:-.03em;line-height:1;margin:10px 0 6px;font-variant-numeric:tabular-nums;color:var(--done);white-space:nowrap}
.cdtime .u{font-size:.36em;color:var(--muted);font-weight:600;margin:0 .35em 0 .08em;letter-spacing:0}
.cdtime.soon{color:var(--prog)}
.clockbar .sub{color:var(--text-2);font-size:13px}
.cdbar{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden;margin-top:12px}
.cdbar i{display:block;height:100%;border-radius:6px;background:var(--done);transition:width 1s linear}
.cdtime.soon~.cdbar i,.cdtime.over~.cdbar i{background:var(--prog)}
.cdtime.over{color:var(--prog)}
.cdworked{color:var(--text-2);font-size:14px;font-variant-numeric:tabular-nums}
.cdworked b{color:var(--text);font-weight:650}

/* ───────── sheet-entry popup ───────── */
dialog.dlg{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:16px;padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog.dlg::backdrop{background:rgba(5,8,12,.6);backdrop-filter:blur(2px)}
.dlg .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg .dh h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.dlg .dh .sub{color:var(--muted);font-size:12.5px}
.dlg .db{padding:16px 18px}
.dlg .where{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ───────── hero ───────── */
.hero{margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.weekcard{margin-top:14px;padding:12px 14px 14px}
.daybar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.daytitle{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 4px}
.daybar .chips{margin-left:6px}
.calwrap{position:relative;display:inline-flex}
.calwrap input{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.weekcard .week{margin-top:0}
.weekcard .wd{background:var(--panel-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid transparent}
.chip.synced{color:var(--done);background:var(--done-bg);border-color:color-mix(in srgb,var(--done) 35%,transparent)}
.chip.approved{color:var(--sky);background:var(--sky-bg);border-color:color-mix(in srgb,var(--sky) 35%,transparent)}
.chip.draft{color:var(--prog);background:var(--prog-bg);border-color:color-mix(in srgb,var(--prog) 35%,transparent)}
.chip.empty{color:var(--muted);background:var(--panel-2);border-color:var(--line-2)}
.stats{display:grid;grid-template-columns:1fr;gap:12px}
.sumcard{padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sumcard .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sumcard h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.sumcard .upd{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sumcard .hl{margin:0;font-size:15px;color:var(--text-2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini.hrs{grid-template-columns:repeat(4,1fr)}
dialog.dlg:has(.aw){width:min(580px,calc(100vw - 32px))}
.aw .dh{padding:18px 22px}.aw .db{padding:20px 22px}.aw .df{padding:14px 22px}
.aw .dh h4{font-size:16px}.aw .dh .sub{color:var(--muted);font-weight:500}
.aw .db{display:grid;gap:14px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}
.seg button{all:unset;flex:1;text-align:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--panel-3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.seg button:focus-visible{outline:2px solid var(--done)}
.awrow{display:grid;grid-template-columns:1fr 140px;gap:10px}
.awrow[hidden]{display:none}
.aw textarea{resize:vertical;min-height:110px}
.aw .field{padding:9px 11px}
.timerow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.timerow input{width:auto;flex:0 1 150px}
.timerow .opt{font-size:12px;margin-left:auto}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.mini.hrs span .m{color:var(--sky)}
.mini.hrs b{font-size:20px}
.wd .w4{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.wd .w4 .x{color:var(--prog);font-weight:600}
.mini div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.mini b{font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}
.sumcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.sumcard pre.cell{margin:0}
.sumcard .chev{transition:transform .2s}.sumcard .open .chev{transform:rotate(180deg)}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:500}
.stat .num{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.dbadge{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px 2px 7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--text-2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* status colours */
.ok{color:var(--done)} .warn{color:var(--prog)}

/* ───────── week strip ───────── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.wd{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.wd:hover{border-color:var(--line-2);transform:translateY(-1px)}
.wd:focus-visible{outline:2px solid var(--done)}
.wd.sel{border-color:var(--done);box-shadow:0 0 0 1px var(--done) inset}
.wd .w1{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wd .w2{font-size:18px;font-weight:700}
.wd .w3{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.wd .bar{height:4px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.wd .bar i{display:block;height:100%;border-radius:4px;background:var(--done)}
.st-synced{color:var(--done)} .st-approved{color:var(--sky)} .st-draft{color:var(--prog)} .st-empty{color:var(--muted)}

/* ───────── tabs ───────── */
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-bottom-color:var(--done)}

/* ───────── summary ───────── */
.grid2{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .note{color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.dcard{margin-bottom:12px;overflow:hidden}
.dhead{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
.dhead:focus-visible{outline:2px solid var(--done);outline-offset:-2px}
.dicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.dhead h3{margin:0;font-size:15px;font-weight:650}
.dhead .cnt{font-size:12px;color:var(--muted)}
.dhead .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.dcard.closed .chev{transform:rotate(-90deg)}
.dcard.closed .dbody{display:none}
.dbody{border-top:1px solid var(--line);padding:4px 16px 8px}
.task{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13px;padding-top:1px;min-width:18px}
.task .t{font-weight:600}
.task .d{grid-column:2;color:var(--text-2)}
.task .meta{grid-column:2;display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.status.done{color:var(--done);background:var(--done-bg)}
.status.prog{color:var(--prog);background:var(--prog-bg)}
.status.other{color:var(--sky);background:var(--sky-bg)}
.sheet{padding:16px;position:sticky;top:14px}
.sheet h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.sheet .where{color:var(--muted);font-size:12.5px;margin-bottom:12px}
pre.cell{white-space:pre-wrap;word-break:break-word;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px;
  font:12.5px/1.6 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;max-height:420px;overflow:auto;color:var(--text-2)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.emptybox{padding:44px 20px;text-align:center;color:var(--muted)}
.emptybox svg.i{width:34px;height:34px;color:var(--line-2);margin-bottom:8px}
.emptybox h3{color:var(--text);margin:0 0 6px;font-size:16px}

/* edit mode */
.erow{display:grid;grid-template-columns:200px 1fr 150px 36px;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel)}
.erow textarea{grid-column:1/4;min-height:60px;resize:vertical}
.erow input,.erow select,.erow textarea,.field{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 9px;width:100%}
.erow input:focus,.erow textarea:focus,.erow select:focus,.field:focus{outline:2px solid color-mix(in srgb,var(--done) 60%,transparent);outline-offset:0}

/* ───────── timeline ───────── */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.fchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.fchip.on{color:var(--text);background:var(--panel-2)}
.ev{display:grid;grid-template-columns:48px 22px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.ev .sx{color:var(--muted);padding-top:1px}
.ev .tx{word-break:break-word;color:var(--text-2);font-size:13px}

/* ───────── insights ───────── */
.ins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ins .card{padding:16px 18px}
.ins h4{margin:0 0 2px;font-size:14px}
.ins .cap{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.timebar{position:relative;height:30px;background:var(--panel-2);border-radius:8px;overflow:hidden}
.timebar span{position:absolute;top:4px;bottom:4px;background:var(--done);border-radius:4px;min-width:3px}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hbar .lbl{display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hbar .trk{height:10px;background:var(--panel-2);border-radius:5px}
.hbar .fil{height:100%;border-radius:0 4px 4px 0;min-width:4px}
.hbar .val{color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbar .v{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;min-height:16px}
.vbar .b{width:100%;max-width:38px;border-radius:4px 4px 0 0;background:var(--g2);min-height:2px}
.vbar .x{font-size:11.5px;color:var(--muted)}
.vbar.sel .b{background:var(--done)}

/* ───────── settings ───────── */
.set{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set .card{padding:18px 20px}
.setupbox summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.setupbox summary::-webkit-details-marker{display:none}
.setupbox summary h4{margin:0}
.setupbox .hint{margin-left:auto;color:var(--muted);font-size:12.5px}
.setupbox[open] .hint{display:none}
.phgrid{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.qrbox{background:#fff;padding:10px;border-radius:12px;line-height:0}
@media (max-width:700px){.phgrid{grid-template-columns:1fr}.qrbox{justify-self:start}}
.set h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--text-2)}
ol.steps b{color:var(--text)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.flow .node{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);font-weight:600;font-size:13px}
.flow .arr{color:var(--muted)}
code{background:var(--panel-2);padding:1px 6px;border-radius:6px;font-size:12.5px}

/* ───────── tooltip & toast ───────── */
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel-3);color:var(--text);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;opacity:0;transition:opacity .1s;max-width:300px;box-shadow:var(--shadow)}
#toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--panel-3);border:1px solid var(--line-2);border-radius:12px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:440px;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:none}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1000px){.clockbar{grid-template-columns:1fr}.clockbar .cd{border-left:0;border-top:1px solid var(--line)}.grid2{grid-template-columns:1fr}.sheet{position:static}.ins,.set{grid-template-columns:1fr}}
@media (max-width:700px){
  .wrap{padding:0 16px 40px}.stats{grid-template-columns:1fr}.mini.hrs{grid-template-columns:repeat(2,1fr)}.clockbar>div{padding:16px}
  .week{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto}
  .erow{grid-template-columns:1fr 36px}.erow input,.erow select,.erow textarea{grid-column:1/2}
  .hbar{grid-template-columns:100px 1fr 36px}.hello p,#runDay .lbl{display:none}.daytitle{font-size:16px}
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <button class="avatar" id="avatar" aria-label="Profile photo" aria-haspopup="menu" data-tip="Profile photo"></button>

      <button role="menuitem" id="avRemove"><svg class="i sm"><use href="#i-x"/></svg>Remove photo</button>
    </div>
    <input type="file" id="avFile" accept="image/png,image/jpeg,image/webp" hidden>

  <nav class="tabs" id="tabs"></nav>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, cls="") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ls = {get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};

/* Domains — fixed hue order, CVD-validated for dark + light surfaces */
/* Project groups come from config.yaml ("groups"); the last group catches everything else */
let DOMAINS = {other:{name:"Other", icon:"file", color:"var(--g-other)", re:null}};
function buildGroups(groups){
  const gs=(groups&&groups.length)?groups:[{name:"Other",icon:"file",match:""}];
  DOMAINS={};
  gs.forEach((g,i)=>{ const last=i===gs.length-1;
    let re=null; try{ re=g.match?new RegExp(g.match,"i"):null }catch{}
    DOMAINS[last?"other":"g"+i]={name:g.name, icon:g.icon||"file", color:last?"var(--g-other)":`var(--g${(i%6)+1})`, re}; });
}
function domainOf(m){
  const s=(m||"").toLowerCase();
  for(const [k,d] of Object.entries(DOMAINS)) if(k!=="other" && d.re && d.re.test(s)) return k;
  return "other";
}
const SRC = {vscode:["VS Code","code"],git:["My commit","git"],"git-action":["Git action","commit"],claude:["Claude Code","chat"],"claude-cmd":["Claude command","term"],
  opencode:["OpenCode","chat"],"opencode-cmd":["OpenCode command","term"],browser:["Browser","globe"],"files-opened":["Opened file","file"],
  "files-changed":["File changed","save"],terminal:["Terminal","term"]};
const STATE = {synced:["In sheet","check"],approved:["Saved","check"],draft:["Draft","clock"],empty:["No entry","circle"]};
const stateChip = s => `<span class="chip ${s}">${ic(STATE[s][1],"sm")}${STATE[s][0]}</span>`;
function statusPill(st){
  const s=(st||"").toLowerCase();
  if(s.startsWith("complete")) return `<span class="status done">${ic("check","sm")}Completed</span>`;
  if(s.includes("progress")) return `<span class="status prog">${ic("clock","sm")}In progress</span>`;
  return `<span class="status other">${ic("info","sm")}${esc(st||"Noted")}</span>`;
}

const S = {date:null, day:null, status:null, over:null, tab:new URLSearchParams(location.search).get("tab")||ls.get("tab")||"summary", edit:false, srcOff:new Set(), q:"", open:{}};

/* helpers */
const today = () => { const d=new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10) };
const addDays = (d,n) => { const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10) };
const fmtLong = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const hm = m => m>=60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`;
const pad = n => String(n).padStart(2,"0");
function toast(msg, icon="info"){ const t=$("#toast"); t.innerHTML=ic(icon)+`<span>${esc(msg)}</span>`; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),4000) }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  if(r.status===401){ location.href="/login"+location.hash; throw new Error("Sign in first"); }   // phone session expired
  const j = await r.json().catch(()=>({})); if(!r.ok && !("ok" in j)) throw new Error(j.error||r.status); return j;
}
async function busy(btn, label, fn){ const old=btn.innerHTML; btn.disabled=true; btn.innerHTML=ic("refresh","sm spin")+label;
  try{ return await fn() } catch(e){ toast(e.message,"alert") } finally{ if(btn.isConnected){btn.disabled=false; btn.innerHTML=old} } }
const sheetText = items => items.map((it,i)=>`${i+1}. ${(it.module||"").startsWith("[")?it.module:"["+it.module+"]"} --> ${it.details||it.action}`).join("\n");

/* tooltip */
const tip=$("#tip");
document.addEventListener("mousemove",e=>{ const t=e.target.closest("[data-tip]"); if(!t){tip.style.opacity=0;return}
  tip.textContent=t.dataset.tip; tip.style.opacity=1; tip.style.left=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(e.clientY+16)+"px" });

/* theme — dark by default */
function setTheme(t){ document.documentElement.dataset.theme=t; $("#theme").innerHTML=ic(t==="light"?"moon":"sun"); ls.set("theme",t) }
setTheme(ls.get("theme")||"dark");
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

/* header */
function renderHeader(){
  const o=S.status.owner, h=new Date().getHours();
  renderAvatar();
  $("#hello").textContent = `${h<12?"Good morning":h<17?"Good afternoon":"Good evening"}, ${o.short_name}`;
  $("#role").textContent = o.role;
  document.title = `${o.short_name}'s Work Log`;
}

/* profile photo — default user icon, click to upload / remove */
function renderAvatar(){
  const v=S.status?.avatar, el=$("#avatar");
  const key=v?"img"+v:"icon"; if(el.dataset.k===key) return; el.dataset.k=key;
  el.innerHTML=(v?`<img src="/avatar?v=${v}" alt="">`:ic("user"))+`<span class="cam">${ic("camera")}</span>`;
  $("#avRemove").hidden=!v;
}
$("#avatar").onclick=e=>{ e.stopPropagation(); const m=$("#avMenu");
  if(!S.status?.avatar){ $("#avFile").click(); return; }      // no photo yet → straight to the file picker
  m.hidden=!m.hidden; if(!m.hidden) $("#avUpload").focus(); };
document.addEventListener("click",e=>{ if(!e.target.closest("#avMenu")) $("#avMenu").hidden=true; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#avMenu").hidden=true; });
$("#avUpload").onclick=()=>{ $("#avMenu").hidden=true; $("#avFile").click(); };
$("#avRemove").onclick=async()=>{ $("#avMenu").hidden=true; const r=await api("/api/avatar",{remove:true}); S.status.avatar=r.avatar; renderAvatar(); toast("Photo removed","check"); };
$("#avFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast("Choose a PNG, JPG or WebP picture","alert");
  try{
    const img=await createImageBitmap(f), n=Math.min(img.width,img.height), c=document.createElement("canvas");
    c.width=c.height=256; c.getContext("2d").drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,256,256);   // centre square crop
    const r=await api("/api/avatar",{data:c.toDataURL("image/jpeg",0.9)});
    if(!r.ok) throw new Error(r.error||"Upload failed");
    S.status.avatar=r.avatar; renderAvatar(); toast("Photo updated","check");
  }catch(err){ toast(err.message||"Could not read this picture","alert") }
};

const TZLABEL = (()=>{ const z=Intl.DateTimeFormat().resolvedOptions().timeZone||"", o=-new Date().getTimezoneOffset();
  return `${z.split("/").pop().replace(/_/g," ")} (GMT${o>=0?"+":"-"}${Math.floor(Math.abs(o)/60)}${Math.abs(o)%60?":"+pad(Math.abs(o)%60):""})` })();
/* clock banner — current time + workday countdown (starts when the PC is turned on, or my first activity) */
const t12 = t => t.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const hms = ms => { let s=Math.max(0,Math.floor(ms/1000)); return [Math.floor(s/3600),Math.floor(s%3600/60),s%60] };
const dur = ms => { const [h,m,s]=hms(ms); return `${h}h ${pad(m)}m ${pad(s)}s` };
function workStart(){ const w=S.status?.workday; return w?.start ? new Date(w.start) : null }
function tick(){
  const now=new Date();
  const [h,m,sec]=[now.getHours(),now.getMinutes(),now.getSeconds()];
  $("#bigTime").innerHTML=`${(h%12)||12}:${pad(m)}<span class="sec">:${pad(sec)}</span><span class="ap">${h<12?"AM":"PM"}</span>`;
  $("#bigDate").textContent=now.toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+TZLABEL;
  tickHours(now);
  const w=S.status?.workday, st=workStart(), el=$("#cdTime");
  if(!w) return;
  if(!st){ el.className="cdtime"; el.textContent="--:--:--"; $("#cdLab").innerHTML=ic("zap","sm")+"Workday · starts with my first activity"; $("#cdWorked").textContent=""; $("#cdBar").style.width="0"; return; }
  const total=w.hours*3600e3, worked=now-st, left=total-worked, end=new Date(+st+total);
  const u=([a,b,c])=>`${pad(a)}<span class="u">h</span>${pad(b)}<span class="u">m</span>${pad(c)}<span class="u">s</span>`;
  const startTxt = (w.source==="pc_on"?"PC on at ":"Started at ")+t12(st);
  if(left>0){
    el.className="cdtime"+(left<30*60e3?" soon":""); el.innerHTML=u(hms(left));
    $("#cdLab").innerHTML=ic("zap","sm")+`Workday countdown · ${startTxt} · ends ${t12(end)}`;
  } else {
    el.className="cdtime over"; el.innerHTML="+"+u(hms(-left));
    $("#cdLab").innerHTML=ic("clock","sm")+`Extra time · ${w.hours}h completed at ${t12(end)}`;
  }
  $("#cdWorked").innerHTML = left>0 ? `Worked <b>${dur(worked)}</b> of ${w.hours}h`
    : `Worked <b>${dur(worked)}</b> · ${w.hours}h done · Extra <b style="color:var(--prog)">${dur(-left)}</b>`;
  $("#cdBar").style.width=`${Math.min(100,worked/total*100).toFixed(2)}%`;
}
tick(); setTimeout(()=>{tick(); setInterval(tick,1000)}, 1000-new Date().getMilliseconds());
setInterval(()=>{ if(document.visibilityState==="visible" && !S.edit && !$("#addDlg").open) refreshAll() }, 5*60e3);   // keep today's activity fresh

/* Save my day now (top-right) */
function renderAuto(){}
$("#runDay").onclick=e=>busy(e.currentTarget,"<span class=\"lbl\"> Saving…</span>",async()=>{
  const r=await api("/api/run-day",{date:S.date});
  const push=(r.log||"").split("\n").find(l=>/push:/.test(l))||"";
  const row=push.match(/row (\d+)/);

  const sn=$("#syncNow"); if(sn) sn.onclick=e=>busy(e.currentTarget," Updating…",async()=>{ let r=await api("/api/push",{date:S.date});

/* Working hours for the selected day (summary card) — live for today */

function tickHours(now){
  const h=S.day?.hours; if(!h?.live || S.date!==today()) return;

  const t=$("#hTotal"), e=$("#hEnd"), xe=$("#hExtra"); if(!t) return;

/* Overall summary panel (My day, right side) — exactly what is in the sheet */
function pushNote(r){
  if(!r) return "";
  if(r.ok) return ` — sheet updated (row ${r.row})`;
  if(r.status==="cell_not_empty") return ` — row ${r.row} has text I typed in the sheet, open Sheet entry to replace it`;
  if(r.status==="sheet_sync_off") return "";
  return ` — sheet not updated (${r.status||r.error||"error"})`;
}
function typeInto(el, text){                 // show the new AI text being written
  if(!el) return; el.textContent=""; let i=0; const step=Math.max(2,Math.ceil(text.length/90));
  const t=setInterval(()=>{ i+=step; el.textContent=text.slice(0,i); if(i>=text.length){ clearInterval(t); el.textContent=text } }, 16);
}

      <div class="vbars">${wk.map(d=>`<div class="vbar ${d.date===S.date?"sel":""}" data-tip="${esc(fmtLong(d.date))}: ${hm(d.active_min)} active · ${d.items} item(s)"><span class="v">${d.active_min?hm(d.active_min):""}</span><div class="b" style="height:${d.active_min/wmax*80}%"></div><span class="x">${new Date(d.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"})}</span></div>`).join("")}</div></div>
    <div class="card"><h4>Where my time went</h4><p class="cap">Activity on this day, by domain</p>
      ${raw?.events?.length?hbars(cnt(e=>domainOf(e.module==="[Unspecified]"?"":e.module)),k=>DOMAINS[k].color,k=>DOMAINS[k].name):`<div class="emptybox" style="padding:20px">No activity</div>`}</div>
    <div class="card"><h4>Captured from</h4><p class="cap">Which sources recorded this day</p>
      ${raw?.events?.length?hbars(cnt(e=>e.src),()=>"var(--g-other)",k=>(SRC[k]||[k])[0]):`<div class="emptybox" style="padding:20px">No activity</div>`}</div>
    <div class="card"><h4>Domains this week</h4><p class="cap">How many days each domain appears in my log</p>
      ${S.over.domain_days.length?hbars(S.over.domain_days,k=>DOMAINS[domainOf(k)].color,k=>k,"day(s)"):`<div class="emptybox" style="padding:20px">No entries this week</div>`}</div>
  </div>`;
}

/* Open on my phone — ONE link + ONE QR code:
   PC on  → the page opens my live dashboard (same Wi-Fi; other devices sign in with a password)
   PC off → my saved work from the Google Sheet (served by the sheet's script) */
function phoneCard(st){
  const r=st.remote||{}, box=c=>`<div class="card" id="phoneCard" style="grid-column:1/-1"><h4>${ic("phone","sm")}Open on my phone</h4>${c}</div>`;
  if(!r.viewer_local) return box(`<div class="toolbar" style="margin:0"><span class="ok">${ic("check","sm")} Signed in from this device</span><span class="sp"></span>
      <button class="btn" id="signOut">${ic("logout","sm")}Sign out</button></div>
    <p style="color:var(--muted);font-size:12.5px;margin:6px 0 0">The sheet key, sheet link, email recipients and phone settings can only be changed on the PC itself.</p>`);
  const link = st.view_url || (r.urls||[])[0] || "";
  // ── 1. the one link
  let top;
  if(st.view_url){
    top=`<div class="where" style="margin:0 0 6px">My phone link — keep it private:</div>
      <div class="toolbar" style="margin:0 0 8px"><code style="flex:1;min-width:200px;padding:9px 11px;word-break:break-all;font-size:12.5px">${esc(st.view_url)}</code></div>
      <div class="toolbar" style="margin:0"><button class="btn primary" id="pCopy">${ic("copy","sm")}Copy link</button>
        <a class="btn" href="${esc(st.view_url)}" target="_blank" rel="noopener">${ic("ext","sm")}Open</a>
        <button class="btn ghost" id="viewNew" data-tip="The old link stops working">New link</button></div>
      ${(st.script_version||0)>=5
        ? `<p style="color:var(--text-2);font-size:13px;margin:10px 0 0"><b class="ok">PC on</b> → opens my live dashboard (on the same Wi-Fi it opens by itself) · <b>PC off</b> → my saved days, tasks and hours from the sheet.</p>`
        : `<div class="warn" style="margin:12px 0 0">${ic("alert","sm")} The link works and shows my saved work. Update the script once more so the <b>same link</b> also opens my live dashboard when the PC is on:</div>
        <ol class="steps" style="font-size:13px;margin:6px 0 10px"><li><button class="btn" id="vCopyScript2">${ic("copy","sm")}Copy script</button></li>
        <li>In the sheet: <b>Extensions → Apps Script</b> → select all, paste over the old code → <b>Save</b>.</li>
        <li><b>Deploy → Manage deployments</b> → pencil icon → Version: <b>New version</b> → <b>Deploy</b> (not "New deployment").</li>
        <li><button class="btn" id="vRecheck">${ic("refresh","sm")}Check again</button></li></ol>`}`;
  } else if(!st.sheet_sync){
    top=`<p style="color:var(--text-2);margin:0">Connect the Google Sheet first (below) to get <b>one link</b> that also works when this PC is off.${r.enabled?" Until then, use the live link:":""}</p>
      ${r.enabled&&link?`<div class="toolbar" style="margin:8px 0 0"><code style="flex:1;padding:9px 11px">${esc(link)}</code><button class="btn" id="pCopy">${ic("copy","sm")}Copy</button></div>`:""}`;
  } else {
    top=`<p style="color:var(--text-2);margin:0 0 12px">One link and one QR code for my phone: it opens my <b>live dashboard</b> when this PC is on, and my <b>saved work from the sheet</b> when the PC is off — from any network.</p>
      <div id="viewMsg"></div><button class="btn primary" id="viewMake">${ic("phone","sm")}Create my phone link</button>`;
  }
  // ── 2. live dashboard while the PC is on
  const live = !r.enabled
    ? `<p style="color:var(--text-2);margin:0 0 10px">Off — the link shows only the saved work. Turn on to open the <b>live</b> dashboard from the phone (same Wi-Fi). Other devices must sign in with this password.</p>
       <div class="toolbar" style="margin:0"><input class="field" id="rPw" type="password" autocomplete="new-password" placeholder="${r.has_password?"New password (or leave empty to keep the old one)":"Choose a password (6+ characters)"}" style="flex:1;min-width:220px" aria-label="Password">
         <button class="btn" id="rOn">Turn on</button></div>`
    : `<div class="toolbar" style="margin:0 0 8px"><span class="ok">${ic("check","sm")} On</span><code style="padding:6px 10px">${esc((r.urls||[])[0]||"no network")}</code><span class="sp"></span>
         <button class="btn ghost" id="rOff">Turn off</button></div>
       ${r.firewall?(st.platform==="windows"?`<div class="where" style="margin:0 0 8px">${ic("info","sm")} ${esc(r.firewall)}</div>`:`<div class="where" style="margin:0 0 6px">If the phone can't open it, allow it through the firewall once (in a terminal):</div><div class="toolbar" style="margin:0 0 8px"><code style="flex:1;min-width:200px;padding:8px 10px;word-break:break-all" id="fwCmd">${esc(r.firewall)}</code><button class="btn" id="fwCopy">${ic("copy","sm")}Copy</button></div>`):""}
       <div class="toolbar" style="margin:0"><input class="field" id="rPw" type="password" autocomplete="new-password" placeholder="New password" style="flex:1;min-width:180px" aria-label="New password">
         <button class="btn" id="rPwSave">Change password</button></div>
       <p style="color:var(--muted);font-size:12.5px;margin:8px 0 0">${ic("info","sm")} Live view away from this Wi-Fi: install <a href="https://tailscale.com/download" target="_blank" rel="noopener">Tailscale</a> on this PC and the phone.</p>`;
  return box(`<div class="phgrid"><div>${top}
      <div class="wksec" style="margin:18px 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Live dashboard when the PC is on</div>${live}
    </div>${link?`<div id="pQr" class="qrbox" aria-label="QR code of my phone link"></div>`:""}</div>`);
}
function bindPhoneCard(){
  const st=S.status, r=st.remote||{};
  const so=$("#signOut"); if(so) so.onclick=async()=>{ await fetch("/api/logout",{method:"POST"}); location.href="/login"; };
  const waitBack=async()=>{ for(let i=0;i<20;i++){ await new Promise(z=>setTimeout(z,700)); try{ S.status=await api("/api/status"); return } catch{} } };
  const set=(btn,label,body,msg)=>busy(btn,label,async()=>{ const x=await api("/api/remote",body); if(!x.ok) throw new Error(x.error||"Could not save");
      if(x.restarting) await waitBack(); else S.status.remote=x.remote; toast(msg,"phone"); renderTabs(); });
  const on=$("#rOn"); if(on) on.onclick=e=>{ const pw=$("#rPw").value; if(!pw && !r.has_password) return toast("Choose a password first","alert");
    if(pw && pw.length<6) return toast("Use at least 6 characters","alert");
    set(e.currentTarget," Turning on…",{enabled:true,password:pw},"Live dashboard on the phone is on"); };
  const off=$("#rOff"); if(off) off.onclick=e=>set(e.currentTarget," Turning off…",{enabled:false},"Live dashboard is now this PC only — the link still shows the saved work");
  const ps=$("#rPwSave"); if(ps) ps.onclick=e=>{ const pw=$("#rPw").value; if(pw.length<6) return toast("Use at least 6 characters","alert");
    set(e.currentTarget," Saving…",{password:pw},"Password changed — other devices must sign in again"); };
  const fw=$("#fwCopy"); if(fw) fw.onclick=async()=>{ try{await navigator.clipboard.writeText($("#fwCmd").textContent);toast("Copied — paste it into a terminal","copy")}catch{} };
  const link = st.view_url || (r.urls||[])[0] || "";
  const cp=$("#pCopy"); if(cp) cp.onclick=async()=>{ try{await navigator.clipboard.writeText(link);toast("Link copied — keep it private","copy")}catch{prompt("Copy this link:",link)} };
  const make=(btn,rotate)=>busy(btn,rotate?" Making a new link…":" Creating…",async()=>{
    const x=await api("/api/view-link",{rotate});
    if(x.ok){ st.view_url=x.url; st.script_version=Math.max(st.script_version||0,5); toast(rotate?"New link ready — the old one no longer works":"Phone link ready — scan the QR code","phone"); return renderTabs(); }
    if(x.error==="update_script"){ const m=$("#viewMsg"); if(m) m.innerHTML=`<div class="warn" style="margin:0 0 6px">${ic("alert","sm")} Update the script in my sheet once (it adds the phone link):</div>
      <ol class="steps" style="font-size:13px;margin:0 0 12px"><li><button class="btn" id="vCopyScript">${ic("copy","sm")}Copy script</button></li>
      <li>In the sheet: <b>Extensions → Apps Script</b> → select all, paste over the old code → <b>Save</b>.</li>
      <li><b>Deploy → Manage deployments</b> → pencil icon → Version: <b>New version</b> → <b>Deploy</b> (not "New deployment").</li>
      <li>Come back and press <b>Create my phone link</b> again.</li></ol>`;
      const c=$("#vCopyScript"); if(c) c.onclick=()=>$("#copyScript").click(); return; }
    throw new Error(x.error||"Could not create the link"); });
  const mk=$("#viewMake"); if(mk) mk.onclick=e=>make(e.currentTarget,false);
  const nw=$("#viewNew"); if(nw) nw.onclick=e=>{ if(confirm("Make a new link? The old link will stop working.")) make(e.currentTarget,true); };
  const c2=$("#vCopyScript2"); if(c2) c2.onclick=()=>$("#copyScript").click();
  const rc=$("#vRecheck"); if(rc) rc.onclick=e=>busy(e.currentTarget," Checking…",async()=>{ const v=await api("/api/script-version",{});
    if(v.version) st.script_version=v.version; toast(v.version>=5?"Up to date — the link now also opens the live dashboard":"Still version "+(v.version||"?")+" — deploy it as a New version", v.version>=5?"check":"alert"); renderTabs(); });
  drawQR($("#pQr"), link);
}
function drawQR(el, url){
  if(!el) return;
  if(!url){ el.style.display="none"; return; }
  const draw=()=>{ el.textContent=""; new QRCode(el,{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); };
  if(window.QRCode) return draw();
  const old=document.querySelector("script[data-qr]");
  if(old){ old.addEventListener("load",draw); return; }
  const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; sc.dataset.qr="1";
  sc.onload=draw; sc.onerror=()=>{ el.style.display="none"; }; document.head.appendChild(sc);
}

/* Settings & help */
function renderSettings(){
  const st=S.status, a=st.automation||{}, o=st.owner;
  const yes=t=>`<span class="ok">${ic("check","sm")} ${t}</span>`, no=t=>`<span class="warn">${ic("alert","sm")} ${t}</span>`;
  $("#pane").innerHTML = `<div class="set">
    <div class="card" style="grid-column:1/-1"><h4>${ic("zap","sm")}How my work log works</h4>
      <div class="flow"><span class="node">${ic("dl","sm")}1 · Collect my activity</span><span class="arr">${ic("right")}</span><span class="node">${ic("spark","sm")}2 · AI writes it up</span><span class="arr">${ic("right")}</span><span class="node">${ic("upload","sm")}3 · Sync to my sheet</span><span class="arr">${ic("right")}</span><span class="node">${ic("mail","sm")}4 · Email the report</span></div>

    <div class="card"><h4>${ic("users","sm")}Profile</h4><dl class="kv">
      <dt>Name</dt><dd>${esc(o.name)}</dd><dt>Role</dt><dd>${esc(o.role)}</dd><dt>Organization</dt><dd>${esc(o.organization)}</dd>

    <div class="card"><h4>${ic("activity","sm")}Automation status</h4><dl class="kv">

      <dt>Safety nets</dt><dd>${st.schedule_installed?yes(`catch-up at start-up · ${esc(a.fallback_at||"23:50")} if still on`):no("not installed")}</dd>
      <dt>AI writing</dt><dd>${st.claude_available?yes(`Claude (${esc(a.ai_model)})`):no("Claude CLI not found")}</dd>
      <dt>Sheet sync</dt><dd>${st.sheet_sync?yes("connected"):no("not set up yet")}</dd>
      <dt>Last run</dt><dd>${st.last_run?esc(Object.entries(st.last_run.steps).map(([k,v])=>`${k}: ${v}`).join(" · ")):"none yet"}</dd></dl></div>
    ${phoneCard(st)}
    <div class="card" style="grid-column:1/-1"><h4>${ic("zap","sm")}${st.shutdown_hook?.active?"Save at shutdown is installed":"Save my day at shutdown (one time)"}</h4>
      ${st.shutdown_hook?.active?`<p style="color:var(--text-2);margin:0">Turning the PC off saves my day to the sheet${st.mail?.enabled?" and emails it":""}. To remove everything, run the installer again with <code>${st.platform==="windows"?"-Uninstall":"--uninstall"}</code>.</p>`:
      `<p style="color:var(--text-2);margin:0 0 10px">${st.platform==="windows"?"Run the installer once (it asks for administrator permission):":"Open a terminal and run the installer once (it asks for my password):"}</p>
      <div class="toolbar"><code style="flex:1;min-width:240px;padding:8px 10px;word-break:break-all" id="hookCmd">${esc(st.install_command)}</code>
        <button class="btn" id="copyHook">${ic("copy","sm")}Copy</button></div>
      <p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">${ic("info","sm")} ${st.platform==="windows"?"Adds a sign-out script, so signing out or shutting down saves my day first.":"A small system service: when the PC shuts down it gets up to 2½ minutes, before the network goes off."}</p>`}</div>
    <div class="card" style="grid-column:1/-1"><h4>${ic("mail","sm")}Daily email</h4>
      <p style="color:var(--text-2);margin:0 0 12px">When I shut down after <b>${esc(a.email_after)}</b>, my day's work report — every task by project, today's numbers and the last 7 days — is emailed from my Gmail through the sheet's script.</p>
      <div class="toolbar"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="mailOn" ${st.mail?.enabled?"checked":""}> Send every day</label>
        <input class="field" id="mailTo" value="${esc((st.mail?.to||[]).join(", "))}" placeholder="me@example.com, boss@example.com" style="flex:1;min-width:240px" aria-label="Send to (comma separated)">
        <button class="btn primary" id="mailSave">${ic("save","sm")}Save</button>
        <button class="btn" id="mailTest">${ic("mail","sm")}Send test</button></div>
      <div style="color:var(--muted);font-size:12.5px;margin:10px 0 0" id="scriptVer">${ic("refresh","sm spin")} Checking the script in my sheet…</div></div>
    <details class="card setupbox" style="grid-column:1/-1" ${st.sheet_sync?"":"open"}><summary><h4>${ic("sheet","sm")}${st.sheet_sync?`<span class="ok">Sheet sync connected</span>`:"Set up sheet sync (one time, about 2 minutes)"}</h4>${st.sheet_sync?`<span class="hint">reconnect</span>`:""}</summary>
      <ol class="steps" style="margin-top:12px">
        <li>Open ${st.sheet_url?`<a href="${esc(st.sheet_url)}" target="_blank" rel="noopener"><b>${esc(st.sheet_name)}</b></a>`:`a new Google Sheet (<a href="https://sheets.new" target="_blank" rel="noopener"><b>sheets.new</b></a>) — the script adds the headers itself`} → menu <b>Extensions → Apps Script</b>.</li>
        <li>Delete everything in the editor, paste my script <button class="btn" id="copyScript">${ic("copy","sm")}Copy script</button> and press <b>Save</b>.</li>
        <li><b>Deploy → New deployment</b> → gear icon → <b>Web app</b>. Set <b>Execute as: Me</b> and <b>Who has access: Anyone</b> → <b>Deploy</b> → authorize with your Google account.</li>

  </div>`;
  bindPhoneCard();
  const ch=$("#copyHook"); if(ch) ch.onclick=async()=>{ try{await navigator.clipboard.writeText($("#hookCmd").textContent);toast("Copied — paste it into a terminal","copy")}catch{toast("The browser blocked copying","alert")} };
  const saveMail=async()=>{ const r=await api("/api/mail-settings",{enabled:$("#mailOn").checked,to:$("#mailTo").value});
    if(!r.ok) throw new Error(r.error); S.status.mail=r.mail; renderAuto(); return r.mail };
  $("#mailSave").onclick=e=>busy(e.currentTarget," Saving…",async()=>{ const m=await saveMail(); toast(m.enabled?`Daily email on → ${m.to.join(", ")||"no recipient yet"}`:"Daily email turned off","mail") });
  $("#mailTest").onclick=e=>busy(e.currentTarget," Sending…",async()=>{ await saveMail(); const r=await api("/api/email",{date:S.date,test:true});
    toast(r.ok?`Test email sent to ${(r.to||[]).join(", ")} — check the inbox`:`Not sent: ${r.error||"unknown error"}`, r.ok?"mail":"alert") });
  const checkScript=()=>{ const el=$("#scriptVer"); if(!el) return;

    api("/api/script-version",{}).then(r=>{ if(!$("#scriptVer")) return;

        : r.version>=5 ? `<span class="ok">${ic("check","sm")} Up to date — email, the “Total Working Hours” column and the phone link are ready.</span>`
        : `<span class="warn" style="display:block;margin-bottom:6px">${ic("alert","sm")} ${r.version>=3?"Email and column C work. Update the script once more to add the phone link (one link: live when the PC is on, saved work when it is off):":r.version>=2?"Email works. To fill column C “Total Working Hours” and add the phone view, update the script in my sheet once:":"Email is not ready: my sheet still runs the old script. Update it once:"}</span>
           <ol class="steps" style="font-size:13px;margin:0 0 10px">
             <li><button class="btn" id="copyScript2">${ic("copy","sm")}Copy script</button></li>
             <li>In the sheet: <b>Extensions → Apps Script</b> → select all, paste over the old code → <b>Save</b>.</li>
             <li><b>Deploy → Manage deployments</b> → pencil icon → Version: <b>New version</b> → <b>Deploy</b>.</li>
             <li>Allow any new permission it asks for, then press <b>Check again</b>.</li>
           </ol>
           <button class="btn primary" id="recheck">${ic("refresh","sm")}Check again</button>`;
      const rc=$("#recheck"); if(rc) rc.onclick=checkScript;
      const c2=$("#copyScript2"); if(c2) c2.onclick=()=>$("#copyScript").click();
    }).catch(()=>{});
  };
  if(st.sheet_sync) checkScript();
  else $("#scriptVer").innerHTML=`<span class="warn">${ic("alert","sm")} Set up sheet sync below first — the email is sent by the same script.</span>`;
  $("#copyScript").onclick=async()=>{ const {code}=await api("/api/apps-script"); try{await navigator.clipboard.writeText(code);toast("Script copied — paste it into Apps Script","copy")}catch{prompt("Copy this script:",code)} };
  $("#saveHook").onclick=e=>busy(e.currentTarget," Testing…",async()=>{ const r=await api("/api/webhook",{url:$("#hookUrl").value});

/* data flow */
async function openDay(d){ S.date=d; $("#pick").value=d; history.replaceState(null,"","#"+d); S.edit=false; await refreshAll() }
async function refreshAll(){
  const t=today(), end = S.date>=addDays(t,-3) ? t : addDays(S.date,3);
  const [st, day, over] = await Promise.all([api("/api/status"), api("/api/day?date="+S.date), api("/api/overview?date="+end)]);
  S.status=st; S.day=day; S.over=over; buildGroups(st.groups);
  renderHeader(); renderAuto(); renderWeek(); renderHero(); renderTabs();
}
$("#prev").onclick=()=>openDay(addDays(S.date,-1));
$("#next").onclick=()=>openDay(addDays(S.date,1));
$("#todayBtn").onclick=()=>openDay(today());
$("#pick").onchange=e=>e.target.value&&openDay(e.target.value);
$("#calBtn").onclick=()=>{ const p=$("#pick"); try{ p.showPicker() }catch{ p.style.pointerEvents="auto"; p.focus(); p.click() } };
openDay(/^\d{4}-\d{2}-\d{2}$/.test(location.hash.slice(1))?location.hash.slice(1):today());
